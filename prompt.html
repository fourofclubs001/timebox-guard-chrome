<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>How long, and why?</title>
    <link rel="icon" href="icons/icon32.png" />
    <link rel="stylesheet" href="common.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }

      form {
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      h1 {
        font-size: 24px;
        text-align: center;
        white-space: pre-line;
      }

      .target {
        margin-top: 8px;
        text-align: center;
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      label,
      .label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .stepper {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }

      .stepper button {
        width: 44px;
        height: 44px;
        padding: 0;
        border-radius: 50%;
        font-size: 22px;
        line-height: 1;
      }

      .stepper output {
        min-width: 110px;
        text-align: center;
        font-size: 34px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .stepper output small {
        font-size: 15px;
        font-weight: 500;
        color: var(--muted);
      }

      .presets {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 10px;
      }

      .presets button {
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 13px;
      }

      .error {
        color: var(--danger);
        font-size: 13px;
        margin: 6px 0 0;
        min-height: 1em;
      }

      .stale {
        margin: 0;
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--bg);
        color: var(--danger);
        font-size: 13px;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .actions button {
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <form id="form" class="card" autocomplete="off">
      <div>
        <h1 id="title">Before you continue,
how long and why?</h1>
        <p id="target" class="target muted" hidden></p>
      </div>

      <div>
        <span class="label" id="minutesLabel">Minutes</span>
        <div class="stepper" role="group" aria-labelledby="minutesLabel">
          <button type="button" id="less" aria-label="5 minutes less">−</button>
          <output id="minutes" aria-live="polite">15 <small>min</small></output>
          <button type="button" id="more" aria-label="5 minutes more">+</button>
        </div>
        <div class="presets">
          <button type="button" data-minutes="5">5</button>
          <button type="button" data-minutes="15">15</button>
          <button type="button" data-minutes="30">30</button>
          <button type="button" data-minutes="60">60</button>
        </div>
      </div>

      <div>
        <label for="reason" id="reasonLabel">Reason</label>
        <input type="text" id="reason" maxlength="200" placeholder="What do you need it for?" />
        <select id="reasonSelect" aria-labelledby="reasonLabel" hidden></select>
        <p class="error" id="error" role="alert"></p>
      </div>

      <p class="stale" id="stale" role="alert" hidden>
        Timebox Guard was updated but is still running its old version. Open
        <strong>chrome://extensions</strong> and click the reload icon on Timebox Guard.
      </p>

      <div class="actions">
        <button type="submit" class="primary" id="start">Start session</button>
        <button type="button" id="close">Close tab instead</button>
      </div>
    </form>

    <script type="module" src="src/prompt.js"></script>
  </body>
</html>
